name: Prepare WTMG source
description: Prepare the WTMG source code for building
runs:
  using: composite
  steps:
    - name: Enable Corepack
      run: corepack enable
      shell: bash
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'yarn'
    - name: Install Dependencies
      # https://github.com/actions/setup-node/blob/main/docs/advanced-usage.md#caching-packages-data
      # https://yarnpkg.com/cli/install
      run: yarn install --immutable
      shell: bash
    # Source images in src/lib/assets are checked out via Git LFS (the caller's
    # actions/checkout step must set `lfs: true`). They used to be fetched from the
    # gs://wtmg-static GCS bucket with gsutil here — no longer needed.
    - name: Cache responsive image transforms
      # svelte-img/vite-imagetools writes generated variants + LQIPs here. Keying on the
      # source images means unchanged assets are served from cache across builds instead
      # of being re-encoded (a large chunk of build time). restore-keys gives a partial
      # fallback so adding one image doesn't discard the whole cache.
      uses: actions/cache@v6
      with:
        path: node_modules/.cache/imagetools
        key: imagetools-${{ runner.os }}-${{ hashFiles('src/lib/assets/**/*.jpg', 'src/lib/assets/**/*.jpeg', 'src/lib/assets/**/*.png') }}
        restore-keys: |
          imagetools-${{ runner.os }}-
