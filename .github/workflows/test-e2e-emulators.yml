name: Run Playwright Tests
on:
  push:
    branches:
      - master
    paths-ignore:
      # Because the build of this Dockerfile will always need to precede this workflow
      - ci/Dockerfile.ci
      - .gitignore
      - docs/**
      - '*.md'
      # This does not run backend test code
      - api/test/**
      # Don't test on workflow files updates, except itself
      - .github/workflows/*
      - '!.github/workflows/test-e2e-emulators.yml'
  pull_request:
    branches:
      - master
    paths-ignore:
      # Because the build of this Dockerfile will always need to precede this workflow
      - ci/Dockerfile.ci
      - .gitignore
      - docs/**
      - '*.md'
      # This does not run backend test code
      - api/test/**
      # Don't test on workflow files updates, except itself
      - .github/workflows/*
      - '!.github/workflows/test-e2e-emulators.yml'
jobs:
  check_duplicate_runs:
    runs-on: ubuntu-24.04
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5.3.1
        with:
          skip_after_successful_duplicate: 'true'
  playwright:
    name: 'Playwright Tests'
    needs: check_duplicate_runs
    if: ${{ needs.check_duplicate_runs.outputs.should_skip != 'true' }}
    runs-on: ubuntu-24.04
    environment: e2e-test-emulators
    container:
      image: ghcr.io/welcometomygarden/wtmg-e2e-ci:24
      options: --user root
      env:
        SENTRY_DSN: ${{vars.SENTRY_DSN}}
        SENTRY_AUTH_TOKEN: ${{secrets.SENTRY_AUTH_TOKEN}}
        MAPBOX_ACCESS_TOKEN: ${{secrets.MAPBOX_ACCESS_TOKEN}}
        THUNDERFOREST_API_KEY: ${{secrets.THUNDERFOREST_API_KEY}}
        STRIPE_PUBLISHABLE_KEY: ${{secrets.STRIPE_PUBLISHABLE_KEY}}
    # Gotchas: https://docs.github.com/en/actions/reference/workflows-and-actions/dockerfile-support
    steps:
      - uses: actions/checkout@v6
        with:
          # src/lib/assets is stored in Git LFS; fetch it during checkout.
          lfs: true
      - uses: actions/setup-node@v6
        with:
          # We don't supply a node version here, because we want to use the one in wtmg-e2e-ci
          # We do want the caching though
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable && cd api && yarn install --immutable && cd ..
      # Source images (src/lib/assets) now come from the Git LFS checkout above
      # (lfs: true) instead of being fetched from the gs://wtmg-static GCS bucket.
      - name: Cache responsive image transforms
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/imagetools
          key: imagetools-${{ runner.os }}-${{ hashFiles('src/lib/assets/**/*.jpg', 'src/lib/assets/**/*.jpeg', 'src/lib/assets/**/*.png') }}
          restore-keys: |
            imagetools-${{ runner.os }}-
      - name: Set up environment
        run: |
          sed -i -z \
            's/,\n[[:space:]]*"extensions": {\n[[:space:]]*"storage-resize-images": "firebase\/storage-resize-images@[0-9]\+\.[0-9]\+\.[0-9]\+"\n[[:space:]]*}\n//g' \
            firebase.json && \
          ./ci/fill-envs.sh
      - name: Build emulator frontend
        run: yarn build:demo
      - name: Run your tests
        run: npx playwright test --project Mobile
      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
